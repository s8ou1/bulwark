[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 256
[profile.ci.invariant]
runs = 64
depth = 32
